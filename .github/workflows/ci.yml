name: Butler Core CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test with coverage
        run: >-
          python -m pytest -q
          --cov=butler_core
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

      - name: Build distributions
        run: python -m build

      - name: Clean-room wheel check
        shell: bash
        run: |
          set -Eeuo pipefail

          CLEAN="$(mktemp -d)"
          python -m venv "$CLEAN/venv"

          "$CLEAN/venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --quiet \
            --no-deps \
            dist/*.whl

          cd "$CLEAN"

          "$CLEAN/venv/bin/python" - <<'PY'
          from butler_core import (
              ToolDefinition,
              ToolPermission,
              ToolRegistry,
          )

          registry = ToolRegistry()
          registry.register(
              ToolDefinition(
                  name="ping",
                  description="CI smoke test.",
                  handler=lambda: "pong",
                  permission=ToolPermission.READ,
              )
          )

          assert registry.names() == ["ping"]
          assert registry.get("ping") is not None
          print("Clean-room contract: OK")
          PY
